<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPUP BAZAAR BD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:25px;background:#101c32;border-bottom:2px solid #00c8ff}
header h1{color:#00c8ff;margin:0}
header p{color:#bbb}
main{max-width:650px;margin:25px auto;padding:15px}
.box{background:#111c30;padding:20px;border-radius:14px;margin-bottom:18px}
h2{color:#00c8ff}
button,.btn{background:#00aaff;color:#00101a;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
button:hover{background:#55d5ff}
input,select{width:100%;padding:13px;margin:8px 0 15px;border-radius:8px;border:1px solid #345;background:#091323;color:white}
.package{background:#1b2b43;padding:14px;border-radius:9px;margin:9px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.package button{margin:0}
.small{color:#aab8cc;font-size:14px}
#status{color:#ffd166}
#paymentInfo{background:#091323;padding:12px;border-radius:8px;line-height:1.8}
</style>
</head>
<body>

<header>
<h1>⚡ TOPUP BAZAAR BD</h1>
<p>Your Trusted Gaming Top-Up Store</p>
</header>

<main>
<div class="box">
<h2>🎮 Select Game</h2>
<div id="games">
<button onclick="choose('Free Fire')">Free Fire</button>
<button onclick="choose('PUBG Mobile')">PUBG Mobile</button>
<button onclick="choose('FC Mobile')">FC Mobile</button>
<button onclick="choose('eFootball')">eFootball</button>
<button onclick="choose('Mobile Legends')">Mobile Legends</button>
<button onclick="choose('Roblox')">Roblox</button>
</div>
</div>

<div class="box">
<h2>💎 Available Packages</h2>
<p id="selectedGame" class="small">প্রথমে একটি Game নির্বাচন করো।</p>
<div id="packages">Package লোড হচ্ছে...</div>
<p id="status"></p>
</div>

<div class="box">
<h2>🛒 Place Your Order</h2>

<label>Selected Package</label>
<input id="selectedPackage" readonly placeholder="একটি Package নির্বাচন করো">

<label>Player ID</label>
<input id="playerId" placeholder="তোমার Game Player ID লিখো">

<label>Payment Method</label>
<select id="payment" onchange="showPayment()">
<option value="">Payment নির্বাচন করো</option>
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
</select>

<div id="paymentInfo">Payment Method নির্বাচন করো।</div>

<label>Transaction ID (TrxID)</label>
<input id="trxId" placeholder="পেমেন্ট করার পর TrxID লিখো">

<button onclick="sendOrder()">✅ Submit Order</button>
<p id="result"></p>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDwXSVZLSxEVtNhePV3XGO42DXqolJNNUE",
  authDomain: "topup-bazaar-bd.firebaseapp.com",
  projectId: "topup-bazaar-bd",
  storageBucket: "topup-bazaar-bd.firebasestorage.app",
  messagingSenderId: "5988939552",
  appId: "1:5988939552:web:3182e2466ace850f004945"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allPackages = [];
let currentGame = "";
let selected = null;
let paymentSettings = {};

db.collection("packages").onSnapshot(snapshot => {
  allPackages = snapshot.docs.map(doc => ({
    id: doc.id,
    ...doc.data()
  }));
  showPackages();
}, error => {
  document.getElementById("packages").innerText =
    "Package লোড হয়নি: " + error.message;
});

db.collection("paymentSettings").doc("main").get()
.then(doc => {
  if(doc.exists) paymentSettings = doc.data();
  showPayment();
})
.catch(error => {
  document.getElementById("paymentInfo").innerText =
    "Payment তথ্য লোড হয়নি: " + error.message;
});

function choose(game){
  currentGame = game;
  selected = null;
  document.getElementById("selectedPackage").value = "";
  document.getElementById("selectedGame").innerText = "Selected Game: " + game;
  showPackages();
}

function showPackages(){
  const area = document.getElementById("packages");

  if(!currentGame){
    area.innerText = "প্রথমে একটি Game নির্বাচন করো।";
    return;
  }

  const list = allPackages.filter(p => p.game === currentGame);

  if(list.length === 0){
    area.innerText = "এই Game-এর কোনো Package পাওয়া যায়নি।";
    return;
  }

  area.innerHTML = "";

  list.forEach(p => {
    const row = document.createElement("div");
    row.className = "package";

    const info = document.createElement("span");
    info.textContent = p.name + " — ৳" + p.price;

    const btn = document.createElement("button");
    btn.textContent = "Select";
    btn.onclick = () => {
      selected = p;
      document.getElementById("selectedPackage").value =
        p.name + " — ৳" + p.price;
    };

    row.appendChild(info);
    row.appendChild(btn);
    area.appendChild(row);
  });
}

function showPayment(){
  const method = document.getElementById("payment").value;
  const info = document.getElementById("paymentInfo");

  if(!method){
    info.innerText = "Payment Method নির্বাচন করো।";
    return;
  }

  const number = method === "bKash"
    ? paymentSettings.bkash
    : paymentSettings.nagad;

  if(!number){
    info.innerText = method + " নম্বর এখনো Admin সেট করেনি।";
    return;
  }

  info.innerHTML =
    "<b>" + method + " Personal/Business Number:</b><br>" +
    "<span style='color:#00c8ff;font-size:22px'>" + number + "</span><br>" +
    "পেমেন্ট করার পর Transaction ID লিখে Order Submit করো।";
}

async function sendOrder(){
  const playerId = document.getElementById("playerId").value.trim();
  const payment = document.getElementById("payment").value;
  const trxId = document.getElementById("trxId").value.trim();
  const result = document.getElementById("result");

  if(!selected) return alert("আগে একটি Package নির্বাচন করো।");
  if(!playerId) return alert("Player ID লিখো।");
  if(!payment) return alert("Payment Method নির্বাচন করো।");
  if(!trxId) return alert("Transaction ID লিখো।");

  result.innerText = "Order জমা হচ্ছে...";

  try{
    await db.collection("orders").add({
      game: currentGame,
      playerId: playerId,
      package: selected.name,
      packagePrice: Number(selected.price),
      payment: payment,
      transactionId: trxId,
      status: "Pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    result.innerText = "✅ Order সফলভাবে জমা হয়েছে!";
    document.getElementById("playerId").value = "";
    document.getElementById("trxId").value = "";
  }catch(error){
    result.innerText = "Order জমা হয়নি: " + error.message;
  }
}
</script>
</body>
</html>
