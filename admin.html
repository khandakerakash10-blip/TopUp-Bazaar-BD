<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPUP BAZAAR BD - Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#080d1b;color:white;
 font-family:Arial,sans-serif;
}
.container{max-width:950px;margin:auto}
h1{color:#36a8ff;text-align:center}
.box{
 background:#111b30;padding:20px;
 border-radius:15px;margin:15px 0;
 border:1px solid #263b60;
}
input,select,button{
 width:100%;padding:13px;margin:7px 0;
 border-radius:8px;border:0;font-size:15px;
}
input,select{background:#eaf2ff;color:#111}
button{
 background:linear-gradient(90deg,#087cff,#873cff);
 color:white;font-weight:bold;cursor:pointer;
}
.red{background:#d83248}
.green{background:#079c69}
.order{
 background:#1b2943;padding:15px;
 border-radius:10px;margin:10px 0;
 overflow-wrap:anywhere;
}
.small{color:#a9c6e8;font-size:13px}
#dashboard{display:none}
</style>
</head>

<body>
<div class="container">

<h1>TOPUP BAZAAR BD</h1>
<h2 style="text-align:center">ADMIN PANEL</h2>

<div class="box" id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="loginError" style="color:#ff7777"></p>
</div>

<div id="dashboard">

<div class="box">
<h3>Dashboard</h3>
<p>Total Orders: <b id="total">0</b></p>
<p>Pending Orders: <b id="pending">0</b></p>
<p>Completed Orders: <b id="completed">0</b></p>
<button class="red" onclick="logout()">LOGOUT</button>
</div>

<div class="box">
<h3>Payment Settings</h3>
<input id="bkash" placeholder="bKash Merchant Number">
<input id="nagad" placeholder="Nagad Merchant Number">
<button onclick="savePayment()">SAVE PAYMENT SETTINGS</button>
</div>

<div class="box">
<h3>Add New Package</h3>

<select id="game">
<option>Free Fire</option>
<option>PUBG Mobile</option>
<option>FC Mobile</option>
<option>eFootball</option>
<option>Mobile Legends</option>
<option>Roblox</option>
</select>

<input id="packageName" placeholder="Package Name">
<input id="price" type="number" placeholder="Price (৳)">

<button onclick="addPackage()">ADD PACKAGE</button>
</div>

<div class="box">
<h3>Orders</h3>
<div id="orders">Loading...</div>
</div>

<div class="box">
<h3>Packages</h3>
<div id="packages">Loading...</div>
</div>

</div>
</div>

<script>
// IMPORTANT: Firebase Console থেকে সঠিক API Key বসাও।
const firebaseConfig = {
  apiKey: "এখানে_তোমার_সঠিক_FIREBASE_API_KEY",
  authDomain: "topup-bazaar-bd.firebaseapp.com",
  projectId: "topup-bazaar-bd",
  storageBucket: "topup-bazaar-bd.firebasestorage.app",
  messagingSenderId: "5988939552",
  appId: "1:5988939552:web:3182e2466ace850f004945"
};

const ADMIN_UID = "YsT6eOaoFjbFqMraxraLuLtK64n2";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 document.getElementById("loginError").innerText="";

 auth.signInWithEmailAndPassword(email,password)
 .catch(error=>{
   document.getElementById("loginError").innerText=error.message;
 });
}

auth.onAuthStateChanged(user=>{
 if(user){
   if(user.uid===ADMIN_UID){
     document.getElementById("loginBox").style.display="none";
     document.getElementById("dashboard").style.display="block";
     loadOrders();
     loadPackages();
     loadPayment();
   }else{
     alert("এই অ্যাকাউন্ট Admin নয়!");
     auth.signOut();
   }
 }else{
   document.getElementById("loginBox").style.display="block";
   document.getElementById("dashboard").style.display="none";
 }
});

function logout(){
 auth.signOut();
}

function savePayment(){
 db.collection("paymentSettings").doc("main").set({
   bkash:document.getElementById("bkash").value.trim(),
   nagad:document.getElementById("nagad").value.trim()
 },{merge:true})
 .then(()=>alert("Payment settings saved!"))
 .catch(e=>alert(e.message));
}

function loadPayment(){
 db.collection("paymentSettings").doc("main").get()
 .then(doc=>{
   if(doc.exists){
     const d=doc.data();
     document.getElementById("bkash").value=d.bkash||"";
     document.getElementById("nagad").value=d.nagad||"";
   }
 });
}

function addPackage(){
 const game=document.getElementById("game").value;
 const name=document.getElementById("packageName").value.trim();
 const price=Number(document.getElementById("price").value);

 if(!name || !price || price<=0){
   alert("Package name ও সঠিক price দাও");
   return;
 }

 db.collection("packages").add({
   game:game,
   package:name,
   price:price,
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
 })
 .then(()=>{
   alert("Package added!");
   document.getElementById("packageName").value="";
   document.getElementById("price").value="";
   loadPackages();
 })
 .catch(e=>alert(e.message));
}

function loadPackages(){
 db.collection("packages").onSnapshot(snapshot=>{
   let html="";
   snapshot.forEach(doc=>{
     const d=doc.data();
     html+=`
     <div class="order">
       <b>${d.game||""}</b><br>
       ${d.package||d.name||""} — ৳${d.price||""}
       <button class="red" onclick="deletePackage('${doc.id}')">
       DELETE
       </button>
     </div>`;
   });
   document.getElementById("packages").innerHTML=html||"No packages";
 });
}

function deletePackage(id){
 if(confirm("এই package delete করবে?")){
   db.collection("packages").doc(id).delete()
   .catch(e=>alert(e.message));
 }
}

function loadOrders(){
 db.collection("orders").orderBy("createdAt","desc")
 .onSnapshot(snapshot=>{
   let html="";
   let pending=0,completed=0;

   document.getElementById("total").innerText=snapshot.size;

   snapshot.forEach(doc=>{
     const d=doc.data();
     const status=d.status||"Pending";

     if(status==="Pending") pending++;
     if(status==="Completed") completed++;

     html+=`
     <div class="order">
       <b>${d.game||""}</b><br>
       Player ID: ${d.playerId||""}<br>
       Package: ${d.package||""}<br>
       Price: ৳${d.packagePrice||""}<br>
       Payment: ${d.payment||""}<br>
       TrxID: ${d.transactionId||""}<br>
       Status: <b>${status}</b>

       <button class="green" onclick="updateOrder('${doc.id}','Payment Verified')">
       PAYMENT VERIFIED
       </button>

       <button onclick="updateOrder('${doc.id}','Completed')">
       DELIVERY COMPLETED
       </button>

       <button class="red" onclick="updateOrder('${doc.id}','Cancelled')">
       CANCEL ORDER
       </button>
     </div>`;
   });

   document.getElementById("pending").innerText=pending;
   document.getElementById("completed").innerText=completed;
   document.getElementById("orders").innerHTML=html||"No orders";
 });
}

function updateOrder(id,status){
 if(!confirm("Order status পরিবর্তন করবে?")) return;

 db.collection("orders").doc(id).update({
   status:status
 })
 .then(()=>alert("Order updated!"))
 .catch(e=>alert(e.message));
}
</script>
</body>
</html>
